name: Deploy Flutter Web

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:
    inputs:
      policy_function:
        description: Insurance policy function used by the web app
        required: true
        default: insurance-policy-simple-v45-deep-review-candidate
        type: choice
        options:
          - insurance-policy-simple-v45-deep-review-candidate
          - insurance-policy-simple-v44-agentic-candidate
          - insurance-policy-simple-v42-luna-candidate
          - insurance-policy-v5
          - insurance-policy-v4

env:
  INSURANCE_POLICY_FUNCTION: ${{ github.event_name == 'workflow_dispatch' && inputs.policy_function || 'insurance-policy-simple-v45-deep-review-candidate' }}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - run: >
          flutter build web
          --release
          --base-href /inventory_system/
          --pwa-strategy=none
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          --dart-define=INSURANCE_KB_VERSION=v3
          --dart-define=INSURANCE_POLICY_FUNCTION=${{ env.INSURANCE_POLICY_FUNCTION }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build

    runs-on: ubuntu-latest

    environment:
      name: github-pages

    steps:
      - uses: actions/deploy-pages@v4
